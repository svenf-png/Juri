<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',-apple-system,system-ui,sans-serif;color:#17141F;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#5B34D1;text-decoration:none}a:hover{color:#4B2AA8}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.tap{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .2s,box-shadow .2s,border-color .2s}
.tap:active{transform:scale(.97)}
.hv-nav:hover{background:#F3F1F8}
.hv-row:hover{background:#F6F4FB}
.hv-card:hover{background:#F1EEF7}
.hv-primary:hover{background:#5B34D1}
.hv-ink:hover{background:#2E1A73}
.hv-ghost:hover{background:#F6F4FB}
.hv-outline:hover{border-color:#A08BEA}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #6A3FE0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #FFFFFF; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); overflow: hidden; line-height: 1.4">
  <div style="background: #6A3FE0; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; padding: 56px; box-sizing: border-box">
    <div style="position: relative; flex-shrink: 0; width: 72px; height: 72px"><div style="position: absolute; left: 0; top: 0; width: 200px; height: 200px; border-radius: 45px; overflow: hidden; transform: scale(0.36); transform-origin: 0 0; background: #6A3FE0"><div style="position: absolute; left: 52px; top: 40px; width: 110px; height: 130px; border-radius: 18px; background: #9A7BEF; transform: rotate(8deg)"></div><div style="position: absolute; left: 40px; top: 36px; width: 110px; height: 130px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span class="d" style="font-family: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif; font-size: 96px; font-weight: 800; color: #17141F; letter-spacing: -0.04em; line-height: 1; margin-top: -6px">J</span></div></div></div>
    <p style="margin: 0; max-width: 520px; display: flex; flex-direction: column; gap: 16px"><span class="d" style="display: block; font-size: 56px; line-height: 1; font-weight: 780; letter-spacing: -0.035em">Karteikarten für das Referendariat.</span><span style="display: block; font-size: 18px; line-height: 1.45; opacity: .9">Alles bleibt auf deinem Gerät, ohne Konto und ohne Server.</span></p>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; padding: 56px; box-sizing: border-box">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 24px">
      <h1 class="d" style="margin: 0; font-size: 48px; line-height: .98; font-weight: 780; letter-spacing: -0.035em">Willkommen <br>bei <span style="color: #6A3FE0">Juri.</span></h1>
      <label style="border-radius: 20px; background: #F6F4FB; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #6B6678">Wie heißt du?</span><span style="min-height: 28px; font-size: 18px; color: #726E7A">Vorname</span></label>
      <span style="margin-top: -12px; font-size: 13px; line-height: 1.4; color: #6B6678">Dein Name steht nur auf diesem Gerät und in Dateien, die du selbst teilst.</span>
      <span class="tap" style="height: 60px; border-radius: 20px; background: #6A3FE0; opacity: .45; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; padding: 0 24px; gap: 8px"><span>Los geht’s</span><span style="margin-left: auto; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
