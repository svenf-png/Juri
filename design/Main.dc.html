<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Heute</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',-apple-system,system-ui,sans-serif;color:#17141F;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#5B34D1;text-decoration:none}a:hover{color:#4B2AA8}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.tap{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s}
.tap:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.seg{transform-origin:left center;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; position: relative; overflow: hidden">
  <div style="padding: 60px 24px 0 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 15px; font-weight: 500; color: #6B6678">Montag, 28. September</div>
      <a href="Einstellungen.dc.html" aria-label="Profil und Einstellungen" class="tap" style="width: 40px; height: 40px; border-radius: 20px; background: #EEE8FD; color: #4B2AA8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">S</a>
    </div>

    <h1 class="d rise" style="margin: 0; font-size: 46px; line-height: 1.0; letter-spacing: -0.03em; font-weight: 750; text-wrap: balance"><span style="color: #6A3FE0">18 Karten</span><br>warten heute.</h1>

    <a href="Fristen.dc.html" class="tap rise" style="align-self: flex-start; height: 34px; padding: 0 14px 0 10px; margin-top: -8px; border-radius: 17px; background: #F6F4FB; color: #17141F; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; animation-delay: .05s">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A3FE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>
      Klausur Zivilrecht <strong style="color: #6A3FE0">in 11 Tagen</strong></a>

    <div class="rise" style="display: flex; flex-direction: column; gap: 10px; animation-delay: .08s">
      <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 14px">
        <span style="color: #6B6678; font-weight: 500">Tagesziel</span>
        <span style="font-weight: 700">6 <span style="color: #6B6678; font-weight: 500">von 24</span></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px">
        <sc-for list="{{segs}}" as="s" hint-placeholder-count="24">
          <div class="seg" style="{{s.style}}"></div>
        </sc-for>
      </div>
    </div>

    <a href="Lernen.dc.html" class="tap rise" style="height: 60px; border-radius: 20px; background: #6A3FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 24px; font-size: 18px; font-weight: 700; box-shadow: 0 10px 24px -10px rgba(106,63,224,.55); animation-delay: .14s">
      <span>Lernen starten</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>

    <div class="rise" style="display: flex; flex-direction: column; gap: 10px; animation-delay: .2s">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="font-size: 13px; font-weight: 600; color: #6B6678; letter-spacing: .04em; text-transform: uppercase">Letzte 7 Tage</div>
        <a href="Erfolge.dc.html" style="font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px">
          <span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #EEE8FD; color: #4B2AA8; display: flex; align-items: center">+3 Karten angelegt</span>Erfolge</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="{{d.dot}}"></div>
            <div style="font-size: 12px; font-weight: 600; color: {{d.labelColor}}">{{d.label}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div class="rise" style="display: flex; flex-direction: column; gap: 4px; animation-delay: .26s">
      <div style="font-size: 13px; font-weight: 600; color: #6B6678; letter-spacing: .04em; text-transform: uppercase; padding-bottom: 6px">Fällig nach Rechtsgebiet</div>
      <sc-for list="{{areas}}" as="a" hint-placeholder-count="3">
        <a href="Bibliothek.dc.html" class="tap" style="height: 52px; display: flex; align-items: center; gap: 14px; color: #17141F; border-bottom: 1px solid #EFECF5">
          <span style="width: 36px; height: 28px; border-radius: 9px; background: #F6F4FB; color: #4B2AA8; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; letter-spacing: .02em">{{a.code}}</span>
          <span style="flex-grow: 1; font-size: 17px; font-weight: 600">{{a.name}}</span>
          <span style="font-size: 17px; font-weight: 700; color: #6A3FE0">{{a.due}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3AEC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 8px 12px 26px 12px; background: rgba(255,255,255,.94); border-top: 1px solid #EFECF5; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6A3FE0; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>Heute</a>
    <a href="Bibliothek.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6678; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M7 4.5h10"></path></svg>Stapel</a>
    <a href="Erstellen.dc.html" aria-label="Neue Karte" class="tap" style="justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: #17141F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Erfolge.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6678; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"></path></svg>Erfolge</a>
    <a href="Teilen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6678; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg>Teilen</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6A3FE0","options":["#6A3FE0","#7B3FD0","#5B4BE8"]},"done":{"editor":"int","default":6,"min":0,"max":24},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6A3FE0';
    const done = this.props.done ?? 6;
    const segs = Array.from({ length: 24 }, (_, i) => ({
      style: 'height: 10px; border-radius: 3px; background: ' + (i < done ? accent : '#EEE8FD') + '; animation-delay: ' + (0.15 + i * 0.018).toFixed(3) + 's'
    }));
    const labels = ['Di', 'Mi', 'Do', 'Fr', 'Sa', 'So', 'Mo'];
    const level = [3, 4, 0, 2, 3, 1, 2];
    const ladder = ['', '#EEE8FD', '#C9B8F7', '#9A7BEF', accent];
    const record = 1;
    const days = labels.map((label, i) => {
      const l = level[i];
      let dot = 'width: 30px; height: 30px; border-radius: 15px; box-sizing: border-box; ';
      dot += l === 0 ? 'border: 2px dashed #D6D1E2;' : 'background: ' + ladder[l] + ';';
      if (i === record) dot += ' box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #17141F;';
      return { label, dot, labelColor: i === 6 ? '#17141F' : '#6B6678' };
    });
    const areas = [
      { code: 'ZR', name: 'Zivilrecht', due: 8 },
      { code: 'SR', name: 'Strafrecht', due: 6 },
      { code: 'ÖR', name: 'Öffentliches Recht', due: 6 }
    ];
    return { segs, days, areas };
  }
}
</script>
</body>
</html>
