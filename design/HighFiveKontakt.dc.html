<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',-apple-system,system-ui,sans-serif;color:#17141F;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#5B34D1;text-decoration:none}a:hover{color:#4B2AA8}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.tap{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .25s,color .25s}
.tap:active{transform:scale(.95)}
@keyframes slap{0%{transform:scale(.3) rotate(-35deg);opacity:0}45%{transform:scale(1.25) rotate(8deg);opacity:1}65%{transform:scale(.92) rotate(-3deg)}100%{transform:none}}
.slap{animation:slap .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes wave{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.wave{animation:wave 1s cubic-bezier(.2,.8,.2,1) .25s both}
.wave2{animation:wave 1s cubic-bezier(.2,.8,.2,1) .45s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fade{animation:fadein .3s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; position: relative; overflow: hidden; padding: 54px 24px 0 24px; display: flex; flex-direction: column; gap: 20px">

      </div>
  </div>
  <button class="tap" style="height: 56px; border-radius: 18px; border: 1.5px dashed #C9B8F7; background: #FFFFFF; color: #17141F; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A3FE0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V6a1.5 1.5 0 0 1 3 0v5M10 11V4.5a1.5 1.5 0 0 1 3 0V11M13 11V5.5a1.5 1.5 0 0 1 3 0V12M16 12V9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.2-2.6L3.6 14.8a1.5 1.5 0 0 1 2.3-1.9L7 14"></path></svg>
    Einfach so ein High five</button>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; color: #6B6678; letter-spacing: .06em; text-transform: uppercase">Bekommen</span>
    <div style="display: flex; flex-direction: column">
      <div style="min-height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EFECF5">

        <span style="flex-grow: 1; font-size: 15px; line-height: 1.35"><strong>Jonas</strong> einfach so</span>
        <span style="font-size: 13px; color: #6B6678">Sa</span>

    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(23,20,31,.28)"></div>
  <div role="dialog" aria-modal="true" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; border-radius: 30px 30px 0 0; background: #FFFFFF; padding: 12px 22px 34px 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -20px 40px -24px rgba(46,26,115,.4)">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DCD6EA"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 class="d" style="margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -0.02em">Kontakt</h2>
      <button class="tap" aria-label="Schließen" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #F6F4FB; color: #17141F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <label style="border-radius: 20px; background: #F6F4FB; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #6B6678">Name</span>
      <input value="Mara" style="width: 100%; box-sizing: content-box; min-height: 28px; padding: 0; border: 0; background: transparent; font-size: 18px; color: #17141F; outline: none">
