<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>High fives: empfangen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',-apple-system,system-ui,sans-serif;color:#17141F;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#5B34D1;text-decoration:none}a:hover{color:#4B2AA8}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.tap{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .25s,color .25s}
.tap:active{transform:scale(.95)}
@keyframes slap{0%{transform:scale(.3) rotate(-35deg);opacity:0}45%{transform:scale(1.25) rotate(8deg);opacity:1}65%{transform:scale(.92) rotate(-3deg)}100%{transform:none}}
.slap{animation:slap .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes wave{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.wave{animation:wave 1s cubic-bezier(.2,.8,.2,1) .25s both}
.wave2{animation:wave 1s cubic-bezier(.2,.8,.2,1) .45s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fade{animation:fadein .3s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; position: relative; overflow: hidden; padding: 54px 24px 0 24px; display: flex; flex-direction: column; gap: 20px">
  <a href="Erfolge.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; font-size: 16px; font-weight: 600; margin-left: -10px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Erfolge</a>
  <div style="display: flex; flex-direction: column; gap: 6px; margin-top: -8px">
    <h1 class="d" style="margin: 0; font-size: 38px; font-weight: 750; letter-spacing: -0.03em">High fives</h1>
    <p style="margin: 0; font-size: 15px; color: #6B6678; line-height: 1.4">Für Erfolge der anderen. Oder einfach so.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; color: #6B6678; letter-spacing: .06em; text-transform: uppercase">Neu von deinen Leuten</span>
    <div style="border-radius: 22px; background: #F6F4FB; padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px">
        <span style="width: 42px; height: 42px; border-radius: 21px; background: #17141F; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">M</span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">Mara</span>
          <span style="font-size: 13.5px; color: #4B2AA8; font-weight: 600">12 Tage in Folge</span>
        </div>
        <button class="tap" aria-label="High five an Mara" style="width: 52px; height: 52px; border-radius: 26px; border: 0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; color: #6A3FE0; box-shadow: 0 4px 12px -6px rgba(46,26,115,.4)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V6a1.5 1.5 0 0 1 3 0v5M10 11V4.5a1.5 1.5 0 0 1 3 0V11M13 11V5.5a1.5 1.5 0 0 1 3 0V12M16 12V9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.2-2.6L3.6 14.8a1.5 1.5 0 0 1 2.3-1.9L7 14"></path></svg></button>
      </div>
    <div style="border-radius: 22px; background: #F6F4FB; padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px">
        <span style="width: 42px; height: 42px; border-radius: 21px; background: #17141F; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">J</span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">Jonas</span>
          <span style="font-size: 13.5px; color: #4B2AA8; font-weight: 600">200 Karten angelegt</span>
        </div>
        <button class="tap" aria-label="High five an Jonas" style="width: 52px; height: 52px; border-radius: 26px; border: 0; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; color: #6A3FE0; box-shadow: 0 4px 12px -6px rgba(46,26,115,.4)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V6a1.5 1.5 0 0 1 3 0v5M10 11V4.5a1.5 1.5 0 0 1 3 0V11M13 11V5.5a1.5 1.5 0 0 1 3 0V12M16 12V9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.2-2.6L3.6 14.8a1.5 1.5 0 0 1 2.3-1.9L7 14"></path></svg></button>
      </div>
  </div>
  <button class="tap" style="height: 56px; border-radius: 18px; border: 1.5px dashed #C9B8F7; background: #FFFFFF; color: #17141F; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A3FE0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V6a1.5 1.5 0 0 1 3 0v5M10 11V4.5a1.5 1.5 0 0 1 3 0V11M13 11V5.5a1.5 1.5 0 0 1 3 0V12M16 12V9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.2-2.6L3.6 14.8a1.5 1.5 0 0 1 2.3-1.9L7 14"></path></svg>
    Einfach so ein High five</button>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 700; color: #6B6678; letter-spacing: .06em; text-transform: uppercase">Bekommen</span>
    <div style="display: flex; flex-direction: column">
      <div style="min-height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EFECF5">
        <span style="width: 34px; height: 34px; border-radius: 17px; background: #EEE8FD; color: #4B2AA8; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">M</span>
        <span style="flex-grow: 1; font-size: 15px; line-height: 1.35"><strong>Mara</strong> für 1.000 Wiederholungen</span>
        <span style="font-size: 13px; color: #6B6678">gestern</span>
      </div>
      <div style="min-height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EFECF5">
        <span style="width: 34px; height: 34px; border-radius: 17px; background: #EEE8FD; color: #4B2AA8; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">J</span>
        <span style="flex-grow: 1; font-size: 15px; line-height: 1.35"><strong>Jonas</strong> einfach so</span>
        <span style="font-size: 13px; color: #6B6678">Sa</span>
      </div>
    </div>
  </div>
  <div class="fade" style="position: absolute; inset: 0; background: rgba(255,255,255,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 36px; text-align: center">
    <div style="position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center">
      <span class="wave" style="position: absolute; inset: 30px; border-radius: 50%; border: 3px solid #6A3FE0"></span>
      <span class="wave2" style="position: absolute; inset: 30px; border-radius: 50%; border: 3px solid #C9B8F7"></span>
      <div class="slap" style="width: 120px; height: 120px; border-radius: 60px; background: #6A3FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V6a1.5 1.5 0 0 1 3 0v5M10 11V4.5a1.5 1.5 0 0 1 3 0V11M13 11V5.5a1.5 1.5 0 0 1 3 0V12M16 12V9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.2-2.6L3.6 14.8a1.5 1.5 0 0 1 2.3-1.9L7 14"></path></svg></div>
    </div>
    <div class="rise" style="display: flex; flex-direction: column; gap: 8px; animation-delay: .35s">
      <span class="d" style="font-size: 34px; font-weight: 750; letter-spacing: -0.02em">High five!</span>
      <span style="font-size: 16px; color: #6B6678; line-height: 1.4">Mara schickt dir ein High five für 12 Tage in Folge.</span>
    </div>
    <div class="rise" style="display: flex; flex-direction: column; gap: 10px; width: 100%; animation-delay: .5s">
      
      <button class="tap" style="height: 48px; border-radius: 16px; border: 0; background: transparent; color: #6B6678; font-size: 15px; font-weight: 700">Schön</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
