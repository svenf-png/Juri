<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',-apple-system,system-ui,sans-serif;color:#17141F;background:#F6F4FB;-webkit-font-smoothing:antialiased}
a{color:#5B34D1;text-decoration:none}a:hover{color:#4B2AA8}
button{font-family:inherit;cursor:pointer}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.tap{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s,box-shadow .18s}
.tap:active{transform:scale(.96)}
.wrap{transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .42s ease}
.wrap.out-r{transform:translateX(118%) rotate(9deg);opacity:0}
.wrap.out-d{transform:translateY(46px) scale(.9);opacity:0}
.wrap.enter{transform:translateY(22px) scale(.95);opacity:0;transition:none}
.inner{transition:transform .62s cubic-bezier(.2,.85,.25,1.08);transform-style:preserve-3d}
.inner.flip{transform:rotateY(180deg)}
.inner.instant{transition:none}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bar{transition:width .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dashoffset:465}to{stroke-dashoffset:0}}
.ring{animation:ring 1.1s cubic-bezier(.3,.7,.2,1) .15s both}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) 1.05s both}
@keyframes burst{0%{transform:translate(0,0) scale(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.spark{animation:burst .9s cubic-bezier(.1,.8,.2,1) 1.1s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4FB; position: relative; overflow: hidden">

  <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 16px; right: 20px; top: 54px; height: 44px; display: flex; align-items: center; gap: 12px">
      <a href="Main.dc.html" aria-label="Lernen beenden" class="tap" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #17141F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
      <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #E4DDF7; overflow: hidden">
        <div class="bar" style="height: 8px; border-radius: 4px; background: #6A3FE0; width: {{pct}}"></div>
      </div>
      <div style="font-size: 14px; font-weight: 700; min-width: 34px; text-align: right">{{counter}}</div>
    </div>

    <div style="position: absolute; left: 36px; right: 36px; top: 150px; height: 520px; border-radius: 28px; background: #FFFFFF; opacity: .45; transform: translateY(26px) scale(.9)"></div>
    <div style="position: absolute; left: 28px; right: 28px; top: 132px; height: 520px; border-radius: 28px; background: #FFFFFF; opacity: .75; transform: translateY(14px) scale(.95)"></div>

    <div class="wrap {{outCls}}" style="position: absolute; left: 20px; top: 118px; width: 350px; height: 520px; perspective: 1400px">
      <div class="inner {{innerCls}}" style="position: relative; width: 350px; height: 520px">

        <button class="face" onClick="{{flip}}" aria-label="Antwort zeigen" style="position: absolute; left: 0; top: 0; width: 350px; height: 520px; box-sizing: border-box; border: 0; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 48px -28px rgba(46,26,115,.35); padding: 26px; display: flex; flex-direction: column; text-align: left; color: #17141F">
          <div style="display: flex; gap: 8px; align-items: center">
            <span style="height: 26px; padding: 0 9px; border-radius: 8px; background: #F6F4FB; color: #4B2AA8; font-size: 12px; font-weight: 800; display: flex; align-items: center">{{card.area}}</span>
            <span style="height: 26px; padding: 0 10px; border-radius: 8px; border: 1.5px solid #E4DDF7; color: #6B6678; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{card.typeLabel}}</span>
            <span style="margin-left: auto; font-size: 13px; font-weight: 700; color: #6A3FE0">{{card.norm}}</span>
          </div>
          <div style="flex-grow: 1; display: flex; align-items: center">
            <sc-if value="{{card.isCloze}}" hint-placeholder-val="{{ false }}">
              <div class="d" style="font-size: 25px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em">{{card.pre}}<span style="display: inline-block; width: 150px; height: 28px; vertical-align: -6px; border-radius: 9px; background: #EEE8FD; border: 1.5px dashed #A08BEA; box-sizing: border-box"></span>{{card.post}}</div>
            </sc-if>
            <sc-if value="{{card.notCloze}}" hint-placeholder-val="{{ true }}">
              <div class="d" style="font-size: 28px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance">{{card.q}}</div>
            </sc-if>
          </div>
          <div style="font-size: 13px; font-weight: 600; color: #6B6678; display: flex; align-items: center; gap: 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"></path><path d="M18 3v4h-4M6 21v-4h4"></path></svg>
            Tippen zum Umdrehen
          </div>
        </button>

        <div class="face" style="position: absolute; left: 0; top: 0; width: 350px; height: 520px; box-sizing: border-box; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 48px -28px rgba(46,26,115,.35); padding: 26px; display: flex; flex-direction: column; gap: 18px; transform: rotateY(180deg)">
          <div style="display: flex; gap: 8px; align-items: center">
            <span style="font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6A3FE0">Antwort</span>
            <span style="margin-left: auto; font-size: 13px; font-weight: 700; color: #6B6678">{{card.norm}}</span>
          </div>
          <sc-if value="{{card.isQA}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 14px">
              <div style="font-size: 15px; font-weight: 600; color: #6B6678; line-height: 1.35">{{card.q}}</div>
              <div style="font-size: 20px; line-height: 1.45; font-weight: 500">{{card.a}}</div>
            </div>
          </sc-if>
          <sc-if value="{{card.isCloze}}" hint-placeholder-val="{{ false }}">
            <div class="d" style="font-size: 25px; line-height: 1.4; font-weight: 600; letter-spacing: -0.01em">{{card.pre}}<span style="background: #EEE8FD; color: #4B2AA8; border-radius: 8px; padding: 1px 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone">{{card.blank}}</span>{{card.post}}</div>
          </sc-if>
          <sc-if value="{{card.isSchema}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <sc-for list="{{card.points}}" as="p" hint-placeholder-count="6">
                <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #F1EEF7">
                  <span style="width: 26px; height: 26px; border-radius: 13px; background: #F6F4FB; color: #4B2AA8; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{p.n}}</span>
                  <div style="flex-grow: 1; display: flex; flex-direction: column">
                    <span style="font-size: 16px; font-weight: 650">{{p.t}}</span>
                    <span style="font-size: 12.5px; color: #6B6678; font-weight: 500">{{p.norm}}</span>
                  </div>
                  <sc-if value="{{p.link}}" hint-placeholder-val="{{ false }}">
                    <span style="height: 28px; padding: 0 9px; border-radius: 14px; background: #EEE8FD; color: #4B2AA8; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>Karte</span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>

      </div>
    </div>

    <div style="position: absolute; left: 20px; right: 20px; top: 682px; height: 110px">
      <sc-if value="{{showFlipBtn}}" hint-placeholder-val="{{ true }}">
        <button class="tap rise" onClick="{{flip}}" style="width: 350px; height: 60px; border: 0; border-radius: 20px; background: #17141F; color: #FFFFFF; font-size: 18px; font-weight: 700">Antwort zeigen</button>
      </sc-if>
      <sc-if value="{{showRate}}" hint-placeholder-val="{{ false }}">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{ratings}}" as="r" hint-placeholder-count="4">
            <button class="tap rise" onClick="{{r.go}}" style="{{r.style}}">
              <span style="font-size: 15px; font-weight: 700">{{r.label}}</span>
              <span style="font-size: 12px; font-weight: 600; opacity: .8">{{r.ivl}}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; padding: 150px 28px 40px 28px; box-sizing: border-box; gap: 28px">
      <div style="position: relative; width: 170px; height: 170px">
        <svg width="170" height="170" viewBox="0 0 170 170" aria-hidden="true">
          <circle cx="85" cy="85" r="74" fill="none" stroke="#EEE8FD" stroke-width="12"></circle>
          <circle class="ring" cx="85" cy="85" r="74" fill="none" stroke="#6A3FE0" stroke-width="12" stroke-linecap="round" stroke-dasharray="465" transform="rotate(-90 85 85)"></circle>
        </svg>
        <div class="pop" style="position: absolute; left: 45px; top: 45px; width: 80px; height: 80px; border-radius: 40px; background: #6A3FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        </div>
        <sc-for list="{{sparks}}" as="s" hint-placeholder-count="10">
          <span class="spark" style="{{s.style}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <h1 class="d rise" style="margin: 0; font-size: 48px; font-weight: 750; letter-spacing: -0.03em; animation-delay: .5s">Geschafft.</h1>
        <p class="rise" style="margin: 0; font-size: 17px; color: #6B6678; line-height: 1.45; animation-delay: .6s">{{summary}}</p>
      </div>
      <div class="rise" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 334px; animation-delay: .7s">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
          <div style="{{s.style}}">
            <span class="d" style="font-size: 24px; font-weight: 750">{{s.n}}</span>
            <span style="font-size: 12px; font-weight: 700">{{s.label}}</span>
          </div>
        </sc-for>
      </div>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; flex-direction: column; gap: 10px; width: 334px">
        <a href="Main.dc.html" class="tap" style="height: 60px; border-radius: 20px; background: #6A3FE0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">Zurück zu Heute</a>
        <button class="tap" onClick="{{restart}}" style="height: 52px; border: 0; border-radius: 18px; background: #F6F4FB; color: #17141F; font-size: 16px; font-weight: 700">Nochmal durchspielen</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
  }
  fresh() {
    return { queue: [0, 1, 2, 3], pos: 0, flipped: false, phase: 'idle', outCls: '', counts: { again: 0, hard: 0, good: 0, easy: 0 }, requeued: {}, done: false };
  }
  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._t2); }
  cards() {
    return [
      { type: 'qa', area: 'SR', norm: '§ 242 StGB', q: 'Was versteht man unter Gewahrsam?', a: 'Die von einem natürlichen Herrschaftswillen getragene tatsächliche Sachherrschaft. Ihre Reichweite bestimmt sich nach der Verkehrsauffassung.', ivl: ['10 min', '2 T', '5 T', '12 T'] },
      { type: 'cloze', area: 'SR', norm: '§ 242 StGB', pre: 'Wegnahme ist der ', blank: 'Bruch fremden und die Begründung neuen', post: ', nicht notwendig tätereigenen Gewahrsams.', ivl: ['10 min', '3 T', '7 T', '16 T'] },
      { type: 'schema', area: 'ÖR', norm: 'VwGO', q: 'Anfechtungsklage: Welche Zulässigkeitspunkte prüfst du?', points: [
        { n: 1, t: 'Verwaltungsrechtsweg', norm: '§ 40 I VwGO' },
        { n: 2, t: 'Statthaftigkeit', norm: '§ 42 I Alt. 1 VwGO' },
        { n: 3, t: 'Klagebefugnis', norm: '§ 42 II VwGO', link: true },
        { n: 4, t: 'Vorverfahren', norm: '§§ 68 ff. VwGO' },
        { n: 5, t: 'Klagefrist', norm: '§ 74 I VwGO' },
        { n: 6, t: 'Beteiligten- und Prozessfähigkeit', norm: '§§ 61, 62 VwGO' }
      ], ivl: ['10 min', '1 T', '4 T', '9 T'] },
      { type: 'qa', area: 'ZR', norm: '§ 331 ZPO', q: 'Voraussetzungen eines Versäumnisurteils gegen den Beklagten?', a: 'Antrag des Klägers, Säumnis des Beklagten im Termin, ordnungsgemäße Ladung, kein Hindernis nach §§ 335, 337 ZPO, Zulässigkeit der Klage und Schlüssigkeit des Klägervortrags.', ivl: ['10 min', '2 T', '6 T', '14 T'] }
    ];
  }
  rate(k) {
    const s = this.state;
    if (s.phase !== 'idle' || !s.flipped) return;
    const counts = Object.assign({}, s.counts);
    counts[k] += 1;
    const queue = s.queue.slice();
    const requeued = Object.assign({}, s.requeued);
    const cur = queue[s.pos];
    if (k === 'again' && !requeued[cur]) { queue.push(cur); requeued[cur] = true; }
    this.setState({ phase: 'out', outCls: k === 'again' ? 'out-d' : 'out-r', counts, queue, requeued });
    this._t = setTimeout(() => {
      const next = this.state.pos + 1;
      if (next >= this.state.queue.length) { this.setState({ done: true, phase: 'idle', outCls: '', flipped: false }); return; }
      this.setState({ pos: next, flipped: false, phase: 'in', outCls: 'enter' });
      this._t2 = setTimeout(() => this.setState({ phase: 'idle', outCls: '' }), 40);
    }, 400);
  }
  renderVals() {
    const s = this.state;
    const all = this.cards();
    const raw = all[s.queue[Math.min(s.pos, s.queue.length - 1)]];
    const labels = { qa: 'Frage', cloze: 'Lücke', schema: 'Schema' };
    const card = Object.assign({}, raw, {
      typeLabel: labels[raw.type], isQA: raw.type === 'qa', isCloze: raw.type === 'cloze', notCloze: raw.type !== 'cloze', isSchema: raw.type === 'schema'
    });
    const doneCount = s.pos + (s.phase === 'out' ? 1 : 0);
    const pct = Math.round((doneCount / s.queue.length) * 100) + '%';
    const base = 'height: 72px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; box-sizing: border-box; ';
    const defs = [
      ['again', 'Nochmal', 'background: #FFFFFF; border: 1.5px solid #DCD6EA; color: #17141F;'],
      ['hard', 'Schwer', 'background: #EEE8FD; border: 0; color: #2E1A73;'],
      ['good', 'Gut', 'background: #C9B8F7; border: 0; color: #17141F;'],
      ['easy', 'Leicht', 'background: #6A3FE0; border: 0; color: #FFFFFF;']
    ];
    const ratings = defs.map((d, i) => ({ label: d[1], ivl: raw.ivl[i], style: base + d[2] + ' animation-delay: ' + (i * 0.05) + 's', go: () => this.rate(d[0]) }));
    const statDefs = [['again', 'Nochmal', 'background: #FFFFFF; border: 1.5px solid #DCD6EA; color: #17141F;'], ['hard', 'Schwer', 'background: #EEE8FD; color: #2E1A73;'], ['good', 'Gut', 'background: #C9B8F7; color: #17141F;'], ['easy', 'Leicht', 'background: #6A3FE0; color: #FFFFFF;']];
    const stats = statDefs.map((d) => ({ n: s.counts[d[0]], label: d[1], style: 'height: 76px; border-radius: 18px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; ' + d[2] }));
    const reviewed = s.queue.length;
    const sparks = Array.from({ length: 10 }, (_, i) => {
      const ang = (i / 10) * Math.PI * 2;
      const r = 118 + (i % 2) * 18;
      const size = i % 3 === 0 ? 10 : 7;
      const col = i % 2 ? '#C9B8F7' : '#6A3FE0';
      return { style: 'position: absolute; left: ' + (85 - size / 2) + 'px; top: ' + (85 - size / 2) + 'px; width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; background: ' + col + '; --dx: ' + Math.round(Math.cos(ang) * r) + 'px; --dy: ' + Math.round(Math.sin(ang) * r) + 'px; animation-delay: ' + (1.1 + i * 0.02).toFixed(2) + 's' };
    });
    return {
      card, pct, counter: Math.min(s.pos + 1, s.queue.length) + '/' + s.queue.length,
      outCls: s.outCls,
      innerCls: (s.flipped ? 'flip' : '') + (s.phase === 'in' ? ' instant' : ''),
      showFlipBtn: !s.flipped, showRate: s.flipped,
      flip: () => { if (!this.state.flipped && this.state.phase === 'idle') this.setState({ flipped: true }); },
      ratings, stats, sparks,
      done: s.done, notDone: !s.done,
      summary: reviewed + ' Wiederholungen, davon ' + s.counts.again + ' nochmal gelernt. Nächste Runde: morgen.',
      restart: () => this.setState(this.fresh())
    };
  }
}
</script>
</body>
</html>
