<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stapel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',-apple-system,system-ui,sans-serif;color:#17141F;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#5B34D1;text-decoration:none}a:hover{color:#4B2AA8}
button,input{font-family:inherit}
button{cursor:pointer}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.tap{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s}
.tap:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; position: relative; overflow: hidden">
  <div style="padding: 64px 24px 0 24px; display: flex; flex-direction: column; gap: 18px">
    <h1 class="d" style="margin: 0; font-size: 40px; font-weight: 750; letter-spacing: -0.03em">Stapel</h1>
    <label style="height: 46px; border-radius: 14px; background: #F6F4FB; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #6B6678">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Suchen</span>
      <input type="search" placeholder="Karten, Normen, Tags" style="flex-grow: 1; border: 0; background: transparent; font-size: 16px; color: #17141F; outline: none">
    </label>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button class="tap" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 18px; height: 520px; overflow: hidden">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div class="rise" style="display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 10px; padding-bottom: 4px">
            <span style="width: 34px; height: 24px; border-radius: 8px; background: #17141F; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{g.code}}</span>
            <span style="font-size: 15px; font-weight: 700">{{g.name}}</span>
          </div>
          <sc-for list="{{g.stacks}}" as="s" hint-placeholder-count="2">
            <a href="Stapel.dc.html" class="tap" style="min-height: 60px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EFECF5; color: #17141F">
              <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
                <span style="font-size: 16.5px; font-weight: 650">{{s.name}}</span>
                <span style="font-size: 13px; color: #6B6678; font-weight: 500">{{s.meta}}</span>
              </div>
              <sc-if value="{{s.multi}}" hint-placeholder-val="{{ false }}">
                <span style="height: 22px; padding: 0 7px; border-radius: 11px; border: 1.5px solid #DCD6EA; font-size: 11px; font-weight: 800; color: #4B2AA8; display: flex; align-items: center">{{s.also}}</span>
              </sc-if>
              <span style="min-width: 28px; height: 28px; border-radius: 14px; background: {{s.dueBg}}; color: {{s.dueFg}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{s.due}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 8px 12px 26px 12px; background: rgba(255,255,255,.94); border-top: 1px solid #EFECF5; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6678; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>Heute</a>
    <a href="Bibliothek.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6A3FE0; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M7 4.5h10"></path></svg>Stapel</a>
    <a href="Erstellen.dc.html" aria-label="Neue Karte" class="tap" style="justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: #17141F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Erfolge.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6678; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"></path></svg>Erfolge</a>
    <a href="Teilen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B6678; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg>Teilen</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'ALL' }; }
  renderVals() {
    const areas = [{ code: 'ZR', name: 'Zivilrecht' }, { code: 'SR', name: 'Strafrecht' }, { code: 'ÖR', name: 'Öffentliches Recht' }];
    const stacks = [
      { name: 'Deliktsrecht', areas: ['ZR'], n: 48, due: 3 },
      { name: 'ZPO: Versäumnisurteil', areas: ['ZR'], n: 32, due: 3 },
      { name: 'Amtshaftung', areas: ['ZR', 'ÖR'], n: 21, due: 2, from: 'Mara' },
      { name: 'Diebstahl & Betrug', areas: ['SR'], n: 40, due: 4 },
      { name: 'StPO: Revision', areas: ['SR'], n: 27, due: 2, from: 'Mara' },
      { name: 'VwGO: Anfechtungsklage', areas: ['ÖR'], n: 35, due: 4 },
      { name: 'Staatsorganisationsrecht', areas: ['ÖR'], n: 18, due: 0 }
    ];
    const f = this.state.f;
    const filters = [{ code: 'ALL', label: 'Alle' }].concat(areas.map((a) => ({ code: a.code, label: a.code }))).map((x) => {
      const on = f === x.code;
      return { label: x.label, on: on ? 'true' : 'false', pick: () => this.setState({ f: x.code }), style: 'height: 38px; padding: 0 16px; border-radius: 19px; font-size: 14px; font-weight: 700; border: ' + (on ? '0' : '1.5px solid #E4DDF7') + '; background: ' + (on ? '#6A3FE0' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#17141F') };
    });
    const groups = areas.filter((a) => f === 'ALL' || f === a.code).map((a) => ({
      code: a.code, name: a.name,
      stacks: stacks.filter((s) => s.areas.indexOf(a.code) >= 0).map((s) => ({
        name: s.name,
        meta: s.n + ' Karten' + (s.from ? ' · von ' + s.from : ''),
        multi: s.areas.length > 1,
        also: 'auch ' + s.areas.filter((c) => c !== a.code).join(', '),
        due: s.due,
        dueBg: s.due > 0 ? '#EEE8FD' : '#F6F4FB',
        dueFg: s.due > 0 ? '#4B2AA8' : '#6B6678'
      }))
    }));
    return { filters, groups };
  }
}
</script>
</body>
</html>
