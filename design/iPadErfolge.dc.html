<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>iPad Erfolge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',-apple-system,system-ui,sans-serif;color:#17141F;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#5B34D1;text-decoration:none}a:hover{color:#4B2AA8}
button{font-family:inherit;cursor:pointer}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.tap{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .2s,color .2s}
.tap:active{transform:scale(.96)}
@keyframes cell{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.cell{animation:cell .45s cubic-bezier(.2,.8,.2,1) both;transition:background-color .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #FFFFFF; display: flex; overflow: hidden">
  <aside style="width: 240px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid #EFECF5; padding: 34px 16px 24px 16px; display: flex; flex-direction: column; gap: 4px">
    <div class="d" style="font-size: 34px; font-weight: 800; letter-spacing: -0.04em; padding: 0 12px 22px 12px; display: flex; align-items: flex-end; line-height: 1">Jur<span style="position: relative; display: inline-block">ı<span style="position: absolute; left: 50%; top: 1px; width: 8px; height: 8px; margin-left: -4px; border-radius: 3px; background: #6A3FE0; transform: rotate(8deg)"></span></span></div>
    <a href="iPadHeute.dc.html" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: #17141F; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>Heute</a>
    <a href="iPadStapel.dc.html" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: #17141F; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"></rect><path d="M7 4.5h10"></path></svg>Stapel</a>
    <a href="iPadErfolge.dc.html" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; background: #F6F4FB; color: #6A3FE0; font-size: 15px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"></path></svg>Erfolge</a>
    <a href="Fristen.dc.html" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: #17141F; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>Fristen</a>
    <a href="Teilen.dc.html" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: #17141F; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg>Teilen</a>
    <a href="Einstellungen.dc.html" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: #17141F; font-size: 15px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>Lernrhythmus</a>
    <div style="flex-grow: 1"></div>
    <a href="iPadErstellen.dc.html" class="tap" style="height: 50px; border-radius: 16px; background: #17141F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Neue Karte</a>
  </aside>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 40px 44px; display: flex; flex-direction: column; gap: 26px">
    <h1 class="d" style="margin: 0; font-size: 44px; font-weight: 750; letter-spacing: -0.03em">Erfolge</h1>

    <div class="rise" style="display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 12px">
      <div style="border-radius: 22px; background: #6A3FE0; color: #FFFFFF; padding: 18px 20px; display: flex; align-items: center; gap: 14px">
        <span class="d" style="font-size: 56px; font-weight: 800; line-height: .9; letter-spacing: -0.04em">12</span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Tage in Folge</span><span style="font-size: 12.5px; opacity: .9">1 Pausentag pro Woche frei</span></span>
      </div>
      <div style="border-radius: 22px; background: #F6F4FB; padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; gap: 2px"><span class="d" style="font-size: 30px; font-weight: 750">1.284</span><span style="font-size: 14px; font-weight: 600; color: #6B6678">Wiederholungen</span></div>
      <div style="border-radius: 22px; background: #F6F4FB; padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; gap: 2px"><span class="d" style="font-size: 30px; font-weight: 750">146</span><span style="font-size: 14px; font-weight: 600; color: #6B6678">Karten angelegt</span></div>
      <a href="HighFive.dc.html" class="tap" style="border-radius: 22px; background: #F6F4FB; padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; gap: 2px; color: #17141F"><span class="d" style="font-size: 30px; font-weight: 750">2</span><span style="font-size: 14px; font-weight: 600; color: #6B6678">High fives bekommen</span></a>
    </div>

    <div class="rise" style="display: flex; flex-direction: column; gap: 12px; animation-delay: .08s">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 600; color: #6B6678; letter-spacing: .04em; text-transform: uppercase">Letzte 26 Wochen</span>
        <div style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #F6F4FB">
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
            <button class="tap" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}">{{m.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(26, minmax(0, 1fr)); grid-template-rows: repeat(7, 22px); grid-auto-flow: column; gap: 5px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="182">
          <div class="cell" style="{{c.style}}"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12.5px; color: #6B6678; font-weight: 600"><span>April</span><span>Mai</span><span>Juni</span><span>Juli</span><span>August</span><span>September</span></div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600">
        <span style="width: 16px; height: 16px; border-radius: 5px; background: #6A3FE0; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #17141F"></span>{{recordText}}
      </div>
    </div>

    <div class="rise" style="display: flex; flex-direction: column; gap: 14px; animation-delay: .16s">
      <span style="font-size: 13px; font-weight: 600; color: #6B6678; letter-spacing: .04em; text-transform: uppercase">Meilensteine</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
            <div style="position: relative; width: 76px; height: 76px">
              <svg width="76" height="76" viewBox="0 0 76 76" style="position: absolute; left: 0; top: 0" aria-hidden="true">
                <circle cx="38" cy="38" r="34" fill="{{b.fill}}" stroke="#EEE8FD" stroke-width="5"></circle>
                <circle cx="38" cy="38" r="34" fill="none" stroke="#6A3FE0" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{b.dash}}" transform="rotate(-90 38 38)"></circle>
              </svg>
              <div style="position: absolute; left: 0; top: 0; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; color: {{b.iconColor}}">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
              </div>
            </div>
            <span style="font-size: 13.5px; font-weight: 700; line-height: 1.2">{{b.name}}</span>
            <span style="font-size: 12px; font-weight: 600; color: #6B6678; margin-top: -6px">{{b.sub}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'learn' }; }
  renderVals() {
    const mode = this.state.mode;
    let seed = mode === 'learn' ? 11 : 23;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const W = 26;
    const lv = [];
    for (let i = 0; i < W * 7; i++) {
      const r = rnd();
      lv.push(mode === 'learn' ? (r < 0.12 ? 0 : r < 0.35 ? 1 : r < 0.65 ? 2 : 3) : (r < 0.45 ? 0 : r < 0.72 ? 1 : r < 0.9 ? 2 : 3));
    }
    const last = (W - 2) * 7;
    if (mode === 'learn') { [3, 3, 4, 0, 2, 3, 1].forEach((v, d) => { lv[last + d] = v; }); }
    const recordIdx = mode === 'learn' ? last + 2 : (W - 4) * 7 + 5;
    lv[recordIdx] = 4;
    lv[(W - 1) * 7] = 2;
    const ladder = ['#F1EEF7', '#EEE8FD', '#C9B8F7', '#9A7BEF', '#6A3FE0'];
    const cells = lv.map((l, i) => {
      const w = Math.floor(i / 7), d = i % 7;
      const future = w === W - 1 && d > 0;
      let style = 'border-radius: 6px; background: ' + (future ? 'transparent' : ladder[l]) + '; animation-delay: ' + (w * 0.015 + d * 0.01).toFixed(3) + 's;';
      if (i === recordIdx) style += ' box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #17141F;';
      return { style };
    });
    const modes = [['learn', 'Gelernt'], ['make', 'Angelegt']].map((m) => {
      const on = mode === m[0];
      return { label: m[1], on: on ? 'true' : 'false', pick: () => this.setState({ mode: m[0] }), style: 'height: 32px; padding: 0 14px; border: 0; border-radius: 9px; font-size: 13px; font-weight: 700; background: ' + (on ? '#FFFFFF' : 'transparent') + '; color: ' + (on ? '#17141F' : '#6B6678') + '; box-shadow: ' + (on ? '0 2px 6px -2px rgba(46,26,115,.25)' : 'none') };
    });
    const C = 2 * Math.PI * 34;
    const defs = [
      ['Erste Karte', 'geschafft', 1, 'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3'],
      ['100 angelegt', 'geschafft', 1, 'M4 8h16v12H4zM7 4.5h10'],
      ['Schema-Baumeister', '7 von 10', 0.7, 'M5 4h6M8 4v16M8 10h6M8 16h6M14 8h5v4h-5zM14 14h5v4h-5z'],
      ['7 Tage am Stück', 'geschafft', 1, 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M9 15l2 2 4-4'],
      ['1.000 Wiederholungen', 'geschafft', 1, 'M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4'],
      ['Teamplayer', '1 von 3 geteilt', 0.33, 'M12 15V4M8 8l4-4 4 4M5 12v7h14v-7']
    ];
    const badges = defs.map((b) => {
      const full = b[2] >= 1;
      return { name: b[0], sub: b[1], icon: b[3], fill: full ? '#6A3FE0' : '#FFFFFF', iconColor: full ? '#FFFFFF' : '#4B2AA8', dash: full ? '0 999' : (C * b[2]).toFixed(1) + ' 999' };
    });
    return { cells, modes, badges, recordText: mode === 'learn' ? 'Rekord: Mi, 23.9. · 86 Wiederholungen' : 'Rekord: Sa, 12.9. · 31 Karten angelegt' };
  }
}
</script>
</body>
</html>
