<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Teilen und Import</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',-apple-system,system-ui,sans-serif;color:#17141F;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#5B34D1;text-decoration:none}a:hover{color:#4B2AA8}
button{font-family:inherit;cursor:pointer}
.d{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.tap{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .2s,border-color .2s}
.tap:active{transform:scale(.97)}
.knob{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.track{transition:background-color .25s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(-2deg)}}
.float{animation:float 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; position: relative; overflow: hidden; padding: 64px 24px 0 24px; display: flex; flex-direction: column; gap: 20px">
  <h1 class="d" style="margin: 0; font-size: 40px; font-weight: 750; letter-spacing: -0.03em">Teilen</h1>

  <div style="border-radius: 26px; background: #F6F4FB; padding: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 16px">
      <div class="float" style="position: relative; width: 58px; height: 70px; flex-shrink: 0">
        <span style="position: absolute; left: 8px; top: 4px; width: 50px; height: 64px; border-radius: 10px; background: #C9B8F7"></span>
        <span style="position: absolute; left: 0; top: 0; width: 50px; height: 64px; border-radius: 10px; background: #6A3FE0; display: flex; align-items: flex-end; justify-content: flex-start; padding: 7px; box-sizing: border-box; color: #FFFFFF; font-size: 10px; font-weight: 800; letter-spacing: .04em">JURI</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 17px; font-weight: 700">Amtshaftung.juri</span>
        <span style="font-size: 13.5px; color: #6B6678; font-weight: 500">21 Karten · 3 PDFs · 2,4 MB</span>
      </div>
    </div>
    <button class="tap" onClick="{{toggleNotes}}" role="switch" aria-checked="{{notesOn}}" style="height: 48px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: space-between; color: #17141F">
      <span style="font-size: 15px; font-weight: 600">Eigene Notizen mitschicken</span>
      <span class="track" style="width: 50px; height: 30px; border-radius: 15px; background: {{trackBg}}; position: relative; display: block">
        <span class="knob" style="position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.2); transform: {{knobX}}"></span>
      </span>
    </button>
    <div style="font-size: 13px; color: #6B6678; line-height: 1.4; margin-top: -8px">Dein Lernfortschritt bleibt immer privat auf deinem Gerät.</div>
    <button class="tap" style="height: 56px; border-radius: 18px; border: 0; background: #17141F; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg>
      AirDrop, Nachrichten, Mail …</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 12px; font-weight: 700; color: #6B6678; letter-spacing: .06em; text-transform: uppercase">Empfangen</span>
    <div style="border-radius: 22px; border: 1.5px solid #EFECF5; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #17141F; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center">M</span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">StPO: Revision</span>
          <span style="font-size: 13px; color: #6B6678">von Mara · Version 4 · 27 Karten</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
          <button class="tap" onClick="{{o.pick}}" role="radio" aria-checked="{{o.on}}" style="{{o.style}}">
            <span style="width: 20px; height: 20px; border-radius: 10px; box-sizing: border-box; border: {{o.ring}}; flex-shrink: 0"></span>
            <span style="display: flex; flex-direction: column; gap: 1px; text-align: left">
              <span style="font-size: 15px; font-weight: 700; color: #17141F">{{o.title}}</span>
              <span style="font-size: 12.5px; color: #6B6678; font-weight: 500">{{o.sub}}</span>
            </span>
          </button>
        </sc-for>
      </div>
      <button class="tap" style="height: 50px; border-radius: 16px; border: 0; background: #6A3FE0; color: #FFFFFF; font-size: 16px; font-weight: 700">Importieren</button>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; font-size: 14px; font-weight: 600">
    <span style="color: #6B6678">Alles sichern</span>
    <a href="Einstellungen.dc.html" style="font-weight: 700">Backup exportieren</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { notes: false, opt: 'update' }; }
  renderVals() {
    const s = this.state;
    const defs = [['update', 'Aktualisieren', 'Du hast Version 3. Neue Karten kommen dazu, dein Fortschritt bleibt.'], ['copy', 'Als Kopie anlegen', 'Eigener, unabhängiger Stapel']];
    const opts = defs.map((d) => {
      const on = s.opt === d[0];
      return { title: d[1], sub: d[2], on: on ? 'true' : 'false', pick: () => this.setState({ opt: d[0] }), ring: on ? '6px solid #6A3FE0' : '2px solid #CFC8E0', style: 'min-height: 56px; border-radius: 14px; border: 0; padding: 8px 12px; display: flex; align-items: center; gap: 12px; background: ' + (on ? '#F6F4FB' : '#FFFFFF') };
    });
    return {
      opts,
      notesOn: s.notes ? 'true' : 'false',
      trackBg: s.notes ? '#6A3FE0' : '#DCD6EA',
      knobX: s.notes ? 'translateX(20px)' : 'translateX(0)',
      toggleNotes: () => this.setState({ notes: !s.notes })
    };
  }
}
</script>
</body>
</html>
